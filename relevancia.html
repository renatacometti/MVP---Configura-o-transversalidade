<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Configuração dos critérios de relevância da seleção de anteprojeto" />
    <title>Relevância | Seleção de Anteprojeto</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell detail-page">
      <aside class="rail" aria-label="Navegação principal">
        <button type="button" class="rail-button" aria-label="Início"><span aria-hidden="true">⌂</span></button>
        <button type="button" class="rail-button" aria-label="Planos"><span aria-hidden="true">⚒</span></button>
        <a class="rail-button" href="index.html" aria-label="Escritórios"><span aria-hidden="true">▦</span></a>
        <button type="button" class="rail-button" aria-label="Permissões"><span aria-hidden="true">▣</span></button>
        <button type="button" class="rail-button people-symbol" aria-label="Pessoas"><span aria-hidden="true">♟♟♟</span></button>
        <a class="rail-button feature-rail-link active" href="selecao-anteprojeto.html" aria-label="Seleção de Anteprojeto" title="Seleção de Anteprojeto" data-tooltip="Seleção de Anteprojeto">
          <img src="icone-selecao-anteprojeto.png" alt="" aria-hidden="true" />
        </a>
      </aside>

      <section class="workspace">
        <header class="topbar detail-topbar">
          <a href="index.html" class="home-icon breadcrumb-link" aria-label="Voltar para configurações">⌂</a>
          <span class="chevron" aria-hidden="true">›</span>
          <div class="breadcrumb-group">
            <div class="breadcrumb-item">
              <a class="breadcrumb breadcrumb-link" href="index.html">Configurações do Escritório</a>
              <small>PMO-ES</small>
            </div>
            <span class="chevron" aria-hidden="true">›</span>
            <div class="breadcrumb-item">
              <a class="breadcrumb breadcrumb-link" href="selecao-anteprojeto.html">Configuração</a>
              <small>Seleção de Anteprojeto</small>
            </div>
            <span class="chevron" aria-hidden="true">›</span>
            <div class="breadcrumb-item"><span class="breadcrumb">GUIA</span></div>
          </div>
        </header>

        <div class="workspace-body relevance-body">
          <div class="toolbar-row relevance-toolbar"><h2>Relevância</h2></div>

          <div class="relevance-sections">
            <section class="config-panel relevance-section" data-section-name="Alinhamento Estratégico">
              <header>
                <h3>ALINHAMENTO ESTRATÉGICO</h3>
                <label class="toggle-control">
                  <span class="toggle-status">Habilitado</span>
                  <input class="section-toggle" type="checkbox" checked aria-label="Habilitar Alinhamento Estratégico" />
                  <span class="toggle-track" aria-hidden="true"><span></span></span>
                </label>
              </header>
              <div class="relevance-content"></div>
            </section>

            <section class="config-panel relevance-section" data-section-name="Criticidade">
              <header>
                <h3>CRITICIDADE</h3>
                <label class="toggle-control">
                  <span class="toggle-status">Habilitado</span>
                  <input class="section-toggle" type="checkbox" checked aria-label="Habilitar Criticidade" />
                  <span class="toggle-track" aria-hidden="true"><span></span></span>
                </label>
              </header>
              <div class="relevance-content"></div>
            </section>

            <section class="config-panel relevance-section" data-section-name="Redução de Desigualdades Sociais">
              <header>
                <h3>REDUÇÃO DE DESIGUALDADES SOCIAIS</h3>
                <label class="toggle-control">
                  <span class="toggle-status">Habilitado</span>
                  <input class="section-toggle" type="checkbox" checked aria-label="Habilitar Redução de Desigualdades Sociais" />
                  <span class="toggle-track" aria-hidden="true"><span></span></span>
                </label>
              </header>
              <div class="relevance-content"></div>
            </section>

            <section class="config-panel relevance-section" data-section-name="Redução de Desigualdades Regionais">
              <header>
                <h3>REDUÇÃO DE DESIGUALDADES REGIONAIS</h3>
                <label class="toggle-control">
                  <span class="toggle-status">Habilitado</span>
                  <input class="section-toggle" type="checkbox" checked aria-label="Habilitar Redução de Desigualdades Regionais" />
                  <span class="toggle-track" aria-hidden="true"><span></span></span>
                </label>
              </header>
              <div class="relevance-content"></div>
            </section>

            <section class="config-panel relevance-section" data-section-name="Inovação">
              <header>
                <h3>INOVAÇÃO</h3>
                <label class="toggle-control">
                  <span class="toggle-status">Habilitado</span>
                  <input class="section-toggle" type="checkbox" checked aria-label="Habilitar Inovação" />
                  <span class="toggle-track" aria-hidden="true"><span></span></span>
                </label>
              </header>
              <div class="relevance-content"></div>
            </section>
          </div>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
