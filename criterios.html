<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Configuração da guia de critérios da seleção de anteprojeto" />
    <title>Nova Guia de Critérios | Seleção de Anteprojeto</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell detail-page criteria-guide-page">
      <aside class="rail" aria-label="Navegação principal">
        <button type="button" class="rail-button" aria-label="Início"><span aria-hidden="true">⌂</span></button>
        <button type="button" class="rail-button" aria-label="Planos"><span aria-hidden="true">⚒</span></button>
        <a class="rail-button" href="index.html" aria-label="Escritórios"><span aria-hidden="true">▦</span></a>
        <button type="button" class="rail-button" aria-label="Permissões"><span aria-hidden="true">▣</span></button>
        <button type="button" class="rail-button people-symbol" aria-label="Pessoas"><span aria-hidden="true">♟♟♟</span></button>
        <a class="rail-button feature-rail-link active" href="selecao-anteprojeto.html" aria-current="page" aria-label="Seleção de Anteprojeto" title="Seleção de Anteprojeto" data-tooltip="Seleção de Anteprojeto">
          <img src="icone-selecao-anteprojeto.png" alt="" aria-hidden="true" />
        </a>
      </aside>

      <section class="workspace">
        <header class="topbar detail-topbar">
          <a href="index.html" class="home-icon breadcrumb-link" aria-label="Voltar para configurações">⌂</a>
          <span class="chevron" aria-hidden="true">›</span>
          <div class="breadcrumb-group">
            <div class="breadcrumb-item">
              <a class="breadcrumb breadcrumb-link" href="index.html">Configurações do Escritório</a>
              <small>PMO-ES</small>
            </div>
            <span class="chevron" aria-hidden="true">›</span>
            <div class="breadcrumb-item">
              <a class="breadcrumb breadcrumb-link" href="selecao-anteprojeto.html">Configuração</a>
              <small>Seleção de Anteprojeto</small>
            </div>
            <span class="chevron" aria-hidden="true">›</span>
            <div class="breadcrumb-item"><span class="breadcrumb">CRITÉRIOS</span></div>
          </div>
        </header>

        <div class="workspace-body criteria-guide-body">
          <div class="toolbar-row criteria-guide-toolbar">
            <h2>Nova Guia de Critérios</h2>
            <div class="detail-actions" aria-label="Opções de visualização">
              <button id="collapse-all" class="double-arrow selected" type="button" aria-label="Recolher todos">⌄⌄</button>
              <button id="expand-all" class="double-arrow" type="button" aria-label="Expandir todos">⌃⌃</button>
              <button type="button" class="selected" aria-label="Visualização em lista" aria-pressed="true">☰</button>
              <button type="button" aria-label="Visualização em grade" aria-pressed="false">▦</button>
              <label><span class="sr-only">Quantidade por página</span>
                <select aria-label="Quantidade por página"><option selected>30</option><option>60</option></select>
              </label>
            </div>
          </div>

          <section class="config-panel properties-panel criteria-properties-panel" aria-labelledby="properties-title">
            <header>
              <h2 id="properties-title">PROPRIEDADES</h2>
              <button id="toggle-properties" type="button" aria-label="Recolher propriedades" aria-expanded="true">⌃</button>
            </header>

            <form id="properties-form" class="properties-form criteria-properties-form">
              <label class="underline-field">
                <span>Nome <b>*</b> <i title="Nome do critério">?</i></span>
                <input type="text" name="name" value="Propriedades" required />
              </label>
              <label class="underline-field position-field">
                <span>Posição <b>*</b> <i title="Posição de exibição">?</i></span>
                <input type="number" name="position" value="1" min="1" required />
              </label>
              <label class="underline-field icon-field">
                <span>Ícone <b>*</b> <i title="Ícone do modelo">?</i></span>
                <span class="icon-selector"><span aria-hidden="true">⚙</span><button type="button" aria-label="Remover ícone">×</button><button type="button" aria-label="Selecionar ícone">⌄</button></span>
              </label>
              <label class="underline-field">
                <span>Peso <b>*</b> <i title="Peso do critério">?</i></span>
                <input type="text" name="weight" value="1" required />
              </label>
              <label class="underline-field operation-field">
                <span>Operação <b>*</b> <i title="Operação aplicada ao critério">?</i></span>
                <select name="operation" required><option value="soma">Soma</option><option value="media">Média</option></select>
              </label>
              <div class="properties-actions">
                <button type="button" class="action-button add-property-button" aria-haspopup="menu" aria-expanded="false">Adicionar propriedade <strong aria-hidden="true">+</strong></button>
                <button id="add-criteria-group" type="button" class="action-button">Adicionar grupo <strong aria-hidden="true">+</strong></button>
              </div>
            </form>
          </section>

          <div id="criteria-groups" class="criteria-groups" aria-live="polite"></div>

          <div class="criteria-page-actions">
            <button id="save-criterion" type="button" class="save-criterion-button">Salvar</button>
            <button id="undo-criterion" type="button" class="undo-criterion-button"><span aria-hidden="true">↶</span> Desfazer</button>
            <p id="criterion-save-status" class="sr-only" role="status" aria-live="polite"></p>
          </div>
        </div>
      </section>
    </main>

    <template id="criteria-group-template">
      <section class="config-panel criteria-group-section">
        <form class="criteria-group-form">
          <label class="underline-field">
            <span>Título <b>*</b> <i title="Título do grupo">?</i></span>
            <input class="criteria-group-title" type="text" name="groupTitle" required />
          </label>
          <label class="underline-field position-field">
            <span>Índice ord. <b>*</b> <i title="Índice de ordenação">?</i></span>
            <input class="criteria-group-index" type="number" name="groupIndex" min="1" required />
          </label>
          <label class="underline-field">
            <span>Peso <b>*</b> <i title="Peso do grupo">?</i></span>
            <input type="text" name="groupWeight" value="1" required />
          </label>
          <label class="underline-field operation-field">
            <span>Operação <b>*</b> <i title="Operação aplicada ao grupo">?</i></span>
            <select name="groupOperation" required><option value="soma">Soma</option><option value="media">Média</option></select>
          </label>
          <label class="group-enable-key-field">
            <input type="checkbox" name="groupEnableKey" />
            <span>Chave Habilitação</span> <i title="Habilitar a chave do grupo">?</i>
          </label>
          <label class="underline-field">
            <span>Valor <i title="Valor da chave de habilitação">?</i></span>
            <input type="text" name="groupEnableValue" />
          </label>
          <label class="underline-field">
            <span>Legenda <i title="Legenda da chave de habilitação">?</i></span>
            <input type="text" name="groupEnableLabel" />
          </label>
          <div class="criteria-group-actions">
            <button type="button" class="action-button add-property-button" aria-haspopup="menu" aria-expanded="false">Adicionar propriedade <strong aria-hidden="true">+</strong></button>
          </div>
        </form>
      </section>
    </template>

    <template id="selection-property-template">
      <section class="criteria-selection-property" aria-label="Propriedade do tipo Seleção Multivalor">
        <header>
          <span class="selection-property-icon" aria-hidden="true">☷</span>
          <span>( Seleção Multivalor )</span>
          <div class="selection-property-controls">
            <button type="button" class="delete-selection-property" aria-label="Excluir propriedade Seleção Multivalor">🗑</button>
            <label class="toggle-control">
              <span class="sr-only">Propriedade habilitada</span>
              <input class="selection-property-enabled" type="checkbox" checked aria-label="Habilitar propriedade Seleção Multivalor" />
              <span class="toggle-track" aria-hidden="true"><span></span></span>
            </label>
            <button type="button" class="toggle-selection-property" aria-label="Recolher propriedade Seleção Multivalor" aria-expanded="true">⌃</button>
          </div>
        </header>

        <form class="selection-property-form">
          <label class="underline-field">
            <span>Nome <b>*</b> <i title="Nome da propriedade">?</i></span>
            <input type="text" name="selectionName" required />
          </label>
          <label class="underline-field">
            <span>Legenda <b>*</b> <i title="Legenda da propriedade">?</i></span>
            <input type="text" name="selectionLabel" required />
          </label>
          <label class="underline-field position-field">
            <span>Índice de Ordenação <i title="Índice de ordenação">?</i></span>
            <input type="number" name="selectionIndex" value="3" min="1" />
          </label>
          <div class="underline-field selection-values-field">
            <span>Possíveis Opções <b>*</b> <i title="Valores disponíveis para seleção">?</i></span>
            <span class="selection-values-control">
              <span class="selection-values-summary">2 valores configurados</span>
              <button type="button" class="add-selection-value" aria-label="Adicionar possível valor">+</button>
            </span>
            <input type="hidden" name="selectionValues" value="Valor 1, Valor 2" />
          </div>
          <label class="underline-field">
            <span>Valor padrão <i title="Valor selecionado inicialmente">?</i></span>
            <input type="text" name="selectionDefault" />
          </label>
          <label class="selection-checkbox-field">
            <input type="checkbox" name="selectionFullLine" checked />
            <span>Linha inteira</span> <i title="Ocupar a linha inteira">?</i>
          </label>
          <label class="selection-checkbox-field">
            <input type="checkbox" name="selectionRequired" />
            <span>Obrigatório</span> <i title="Preenchimento obrigatório">?</i>
          </label>
          <label class="selection-checkbox-field multiple-selection-field">
            <input type="checkbox" name="selectionMultiple" />
            <span>Múltiplas seleções</span> <i title="Permitir mais de uma seleção">?</i>
          </label>
          <label class="underline-field selection-help-field">
            <span>Texto de ajuda <i title="Orientação exibida ao usuário">?</i></span>
            <input type="text" name="selectionHelp" />
          </label>
        </form>
      </section>
    </template>

    <template id="list-property-template">
      <section class="criteria-list-property">
        <header>
          <span class="selection-property-icon list-property-icon" aria-hidden="true">≡</span>
          <span class="list-property-title">( Lista )</span>
          <div class="selection-property-controls">
            <button type="button" class="delete-list-property" aria-label="Excluir propriedade">🗑</button>
            <label class="toggle-control">
              <span class="sr-only">Propriedade habilitada</span>
              <input class="list-property-enabled" type="checkbox" checked aria-label="Habilitar propriedade" />
              <span class="toggle-track" aria-hidden="true"><span></span></span>
            </label>
            <button type="button" class="toggle-list-property" aria-label="Recolher propriedade" aria-expanded="true">⌃</button>
          </div>
        </header>

        <form class="list-property-form">
          <label class="underline-field">
            <span>Nome <b>*</b> <i title="Nome da propriedade">?</i></span>
            <input type="text" name="listName" required />
          </label>
          <label class="underline-field">
            <span>Legenda <b>*</b> <i title="Legenda da propriedade">?</i></span>
            <input type="text" name="listLabel" required />
          </label>
          <label class="underline-field position-field">
            <span>Índice de Ordenação <i title="Índice de ordenação">?</i></span>
            <input type="number" name="listIndex" value="3" min="1" />
          </label>
          <label class="underline-field">
            <span>Valor <b>*</b> <i title="Valor da propriedade">?</i></span>
            <input type="text" name="listValue" required />
          </label>
          <label class="underline-field">
            <span>Peso <b>*</b> <i title="Peso da propriedade">?</i></span>
            <input type="text" name="listWeight" value="1" required />
          </label>
        </form>
      </section>
    </template>

    <dialog id="possible-values-dialog" class="possible-values-dialog" aria-labelledby="possible-values-title">
      <form id="possible-values-form" method="dialog">
        <header>
          <div>
            <h2 id="possible-values-title">Possíveis Opções</h2>
            <p>Cadastre o rótulo exibido e seu respectivo valor.</p>
          </div>
          <button id="close-possible-values" type="button" aria-label="Fechar possíveis opções">×</button>
        </header>

        <div class="possible-values-table">
          <div class="possible-values-table-header" aria-hidden="true">
            <span>RÓTULO</span><span>VALOR</span><span>AÇÕES</span>
          </div>
          <div id="possible-values-rows" class="possible-values-rows"></div>
          <div id="possible-values-empty" class="possible-values-empty">
            <span aria-hidden="true">▦</span>
            <strong>Nenhum valor adicionado.</strong>
            <button type="button" class="add-possible-value-button"><b aria-hidden="true">＋</b> Adicionar valor</button>
          </div>
        </div>

        <button type="button" class="possible-values-add-link add-possible-value-button"><b aria-hidden="true">＋</b> Adicionar valor</button>

        <footer>
          <span id="possible-values-count">0 valores</span>
          <button type="submit" class="complete-possible-values">Concluir</button>
        </footer>
      </form>
    </dialog>
    <script src="script.js"></script>
  </body>
</html>
